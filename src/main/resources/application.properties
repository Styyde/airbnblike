# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/airbnb_clone?replicaSet=rs0}
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=${PORT:8082}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.payment.mode=${PAYMENT_MODE:disabled}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.example.demo=INFO
